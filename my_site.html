<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <link rel="stylesheet" href="style.css">
   <script src="script.js" defer></script>
</head>
<body>
<div id="header">
    <h1>TJ노래방 인기200곡 랜덤 추천</h1>
</div>

<div class="container">
    <nav>
        <button onclick="showHome()">홈</button>
        <br>
        <button onclick="showSongs()">곡 목록</button>
        <br>
        <button onclick="showContact()">버그제보</button>
    </nav>


<main>
    <section id="home">
        <h2>노래방 랜덤 추천</h2>
        <button id="random">랜덤 추천</button>
        <p id="result">버튼을 눌러서 랜덤곡을 뽑으세요.</p>
        
    </section>

    <section id="songList" hidden>
        <h2>전체 곡 목록</h2>
        <ol>
            <li>노래 제목 1 - 가수 A</li>
            <li>노래 제목 2 - 가수 B</li>
            <li>노래 제목 3 - 가수 C</li>
        </ol>
    </section>

    <section id="contact" hidden>
        <h2>문의하기</h2>
        <label>이메일:</label>
        <input type="mail" placeholder="이메일을 입력하세요">
        <br>
        <textarea id="message" placeholder="내용을 입력하세요"></textarea>
        <br><br>
    
    <input type="submit" value="문의하기">
    </section>
</main>

</div>

</body>
</html>
